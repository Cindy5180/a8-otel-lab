name: Lint (A)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 flake8-bandit
      - run: flake8 src/   # non-zero exit fails the build
